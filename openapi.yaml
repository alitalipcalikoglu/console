components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: console_session
      description: "Opaque server-side session token issued by `POST /api/session/login` and set as
        `console_session=<token>; Path=/; HttpOnly; SameSite=Strict[; Secure]`. Resolved on every request by
        an `onRequest` hook that never rejects on its own; individual routes then call `requireSession` (any
        signed-in administrator, TOTP step completed) or `requireAdmin` (the same, plus `role: \"admin\"`).
        Exactly two roles exist: `admin` and `viewer` — a viewer can read everything this console exposes and
        change nothing. The role needed by each operation is stated in its description and in
        `x-required-role`. The browser session is NOT the credential used downstream: console holds a separate
        static API key per configured service and calls the 12 backends with that, so a downstream service can
        never attribute a call to a specific console administrator — only console's own audit log can."
  parameters:
    Paging_limit:
      name: limit
      in: query
      schema:
        type: string
        pattern: ^([1-9]|[1-9][0-9]|100)$
      description: Page size. Forwarded downstream as a number.
    Paging_cursor:
      name: cursor

        pattern: ^[A-Za-z0-9-]+$
    GeoTimezonesQ_country:
      name: country
      in: query
      schema:
        type: string
        minLength: 2
        maxLength: 3
    GeoTimezonesQ_q:
      name: q
      in: query
      schema:
        type: string
        maxLength: 100
    GeoTimezonesQ_lang:
      name: lang
      in: query
      schema:
        type: string
        minLength: 2
        maxLength: 35
        pattern: ^[A-Za-z0-9-]+$
    GeoPhoneQ_number:
      name: number
      in: query
      schema:
        type: string
        minLength: 1
        maxLength: 40
      required: true
    GeoPhoneQ_country:
      name: country
      in: query
      schema:
        type: string
        minLength: 2
        maxLength: 3
    GeoDistanceQ_from:
      name: from
      in: query
      schema:
        type: string
        pattern: ^\s*-?\d{1,3}(\.\d+)?\s*,\s*-?\d{1,3}(\.\d+)?\s*$
      required: true
    GeoDistanceQ_to:
      name: to
      in: query
      schema:
        type: string
        pattern: ^\s*-?\d{1,3}(\.\d+)?\s*,\s*-?\d{1,3}(\.\d+)?\s*$
      required: true
    GeoNearbyQ_lat:
      name: lat
      in: query
      schema:
        type: string
        pattern: ^-?\d{1,3}(\.\d+)?$
      required: true
    GeoNearbyQ_lng:
      name: lng
      in: query
      schema:
        type: string
        pattern: ^-?\d{1,3}(\.\d+)?$
      required: true
    GeoNearbyQ_radius:
      name: radius
      in: query
      schema:
        type: string
        pattern: ^\d{1,5}(\.\d+)?$
    GeoNearbyQ_limit:
      name: limit
      in: query
      schema:
        type: string
        pattern: ^([1-9]|[1-9][0-9]|100)$
    MediaTtlQ_ttl:
      name: ttl
      in: query
      schema:
        type: string
        pattern: ^[0-9]{1,7}$
      description: Signed-URL lifetime in seconds.
    MediaUploadQ_visibility:
      name: visibility
      in: query
      schema:
        type: string
        enum:
          - public
          - private
      description: Visibility for the stored file.
    MediaUploadQ_name:
      name: name
      in: query
      schema:
        type: string
        maxLength: 255
      description: Stored file name; defaults to the one media derives itself.
    SidParam:
      name: sid
      in: path
      required: true
      description: Service instance id, as configured in this deployment's `services.json`. Validated only by shape
        at the schema layer; whether the id exists — and whether the instance behind it is of the type this
        route needs — is checked at call time and both failures produce the same `404 UNKNOWN_SERVICE`. The
        set of valid values is deployment configuration, not part of this contract, and differs per
        environment.
      schema:
        type: string
        pattern: ^[a-z0-9][a-z0-9-]*$
        maxLength: 40
    IdParam:
      name: id
      in: path
      required: true
      description: Downstream resource id, passed through URL-encoded.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[A-Za-z0-9_.:-]+$
    SubParam:
      name: sub
      in: path
      required: true
      description: Second-level downstream resource id (session, environment, document, override, subject, place or
        variant), passed through URL-encoded.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[A-Za-z0-9_.:-]+$
    AdminIdParam:
      name: id
      in: path
      required: true
      description: Console administrator id (UUID).
      schema:
        type: string
        format: uuid
    CsrfHeader:
      name: x-console-request
      in: header
      required: true
      description: CSRF guard. `requireSession`/`requireAdmin` reject every non-GET/HEAD request whose value is not
        exactly `"1"` with `403 FORBIDDEN`. A browser cannot set a custom header cross-site without a CORS
        pre-flight the console never approves, which — together with the `SameSite=Strict` session cookie — is
        the whole CSRF defence.
      schema:
        const: "1"
  headers: {}
  responses:
    ValidationFailed:
      description: Request failed Ajv validation of its path, query or body schema.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            validationFailed:
              value:
                error:
                  code: VALIDATION_FAILED
                  message: body must have required property 'email'
                  details:
                    - path: ""
                      message: must have required property 'email'
    Unauthenticated:
      description: "No usable session: the cookie is missing, expired or idle-timed-out (`UNAUTHENTICATED`), or the
        session exists but the second factor has not been completed yet (`TOTP_REQUIRED` — finish `POST
        /api/session/totp` first)."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            unauthenticated:
              value:
                error:
                  code: UNAUTHENTICATED
                  message: sign in required
    Forbidden:
      description: "Signed in, but not allowed: the `x-console-request: 1` header is missing on a mutating request,
        or the session's role is `viewer` where `admin` is required."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            missingCsrfHeader:
              value:
                error:
                  code: FORBIDDEN
                  message: missing x-console-request header
            viewerRole:
              value:
                error:
                  code: FORBIDDEN
                  message: viewers cannot change anything
    ProxyNotFound:
      description: Either the `sid` names no configured service, or it names one of the wrong type for this route —
        both are `404 UNKNOWN_SERVICE` with no `service` field — or the downstream service itself answered
        404, in which case its own code and message are relayed and `service` names it.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DownstreamErrorEnvelope"
          examples:
            unknownService:
              value:
                error:
                  code: UNKNOWN_SERVICE
                  message: no notify service "nope"
            downstream404:
              value:
                error:
                  code: MESSAGE_NOT_FOUND
                  message: no such message
                  service: notify
    Unreachable:
      description: The downstream service could not be reached at all — connection failure, or the
        `SERVICE_TIMEOUT_MS` deadline (10 s by default) elapsed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DownstreamErrorEnvelope"
          examples:
            unreachable:
              value:
                error:
                  code: UPSTREAM_UNREACHABLE
                  message: "notify unreachable: The operation was aborted due to timeout"
                  service: notify
    DocumentationUpstreamError:
      description: The selected service was unreachable, timed out, returned a non-success status, or served an invalid OpenAPI document.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DownstreamErrorEnvelope"
    DownstreamDefault:
      description: Any other status the downstream service returned, relayed with its own status code, `error.code`,
        `error.message` and `error.details`, plus `error.service`. console does not translate, normalize or
        re-map downstream error codes.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DownstreamErrorEnvelope"
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: The request conflicts with current state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    RateLimited:
      description: Too many attempts from this IP against the pre-session endpoints. console's in-process limiter
        allows `RATE_LIMIT_MAX` (default 30) attempts per IP per window and answers with `retry-after` plus
        `details.retryAfterSec`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            rateLimited:
              value:
                error:
                  code: RATE_LIMITED
                  message: too many attempts, slow down
                  details:
                    retryAfterSec: 42
      headers:
        Retry-After:
          schema:
            type: string
  schemas:
    ErrorEnvelope:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: "Stable machine-readable code. console domain codes (`ConsoleError.STATUS`): INVALID_CREDENTIALS
                (401), UNAUTHENTICATED (401), TOTP_REQUIRED (401), INVALID_TOTP (401), TOTP_UNAVAILABLE (503),
                TOTP_SECRET_CORRUPT (500), ACCOUNT_LOCKED (423), ACCOUNT_DISABLED (403), FORBIDDEN (403),
                NOT_FOUND (404), EMAIL_TAKEN (409), CONFLICT (409), WEAK_PASSWORD (400), INVALID_ARGUMENT
                (400), LAST_ADMIN (409), RATE_LIMITED (429). Cross-cutting codes from console's own error
                handler: VALIDATION_FAILED (400, Ajv schema failure), NOT_FOUND (404, unmatched `/api/*`
                route), REQUEST_ERROR (other 4xx), INTERNAL_ERROR (500, message never leaked)."
            message:
              type: string
            details:
              description: "Present on Ajv validation failures as `[{ path, message }]` — note console hand-rolls its error
                handler and, unlike the shared `service-core` helper every backend service uses, omits
                `params` from those entries. Also present on domain errors that carry structured context:
                `retryAfterSec` (RATE_LIMITED, ACCOUNT_LOCKED) and `problems` (WEAK_PASSWORD)."
    DownstreamErrorEnvelope:
      type: object
      description: Error envelope produced by console's `ServiceError` branch, i.e. every failure that originated in
        — or while reaching — a downstream service. It is the plain `ErrorEnvelope` plus one extra field,
        `service`, naming the service instance that failed. `service` is absent when the failure is
        console-side routing rather than a downstream response (`UNKNOWN_SERVICE`, thrown by
        `ServiceClients#get` before any service is picked).
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: The downstream service's own `error.code` when it sent one; otherwise `UNKNOWN_SERVICE` (404,
                unknown `sid` or an instance of the wrong type), `UPSTREAM_UNREACHABLE` (502, transport
                failure or timeout), `UPSTREAM_ERROR` (downstream 5xx with no parseable code) or
                `UPSTREAM_REJECTED` (downstream 4xx with no parseable code).
            message:
              type: string
            service:
              type: string
              description: The failing service instance id (`sid`). Absent for `UNKNOWN_SERVICE`.
            details:
              description: The downstream service's own `error.details`, forwarded verbatim when present.
    PassThrough:
      type: object
      additionalProperties: true
      description: Raw JSON body of the downstream service's own response, relayed unchanged. console declares no
        Fastify `response:` schema anywhere, so it neither validates nor reshapes these bodies — the
        authoritative schema is the target service's own OpenAPI document for the operation named in the
        response description. Deliberately left open here rather than hand-copied, since nothing in console
        enforces a copy and it would drift silently.
    Health:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          const: ok
    ReadyUnavailable:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          const: unavailable
        error:
          type: string
          description: The `db.ping()` failure message.
    Info:
      type: object
      required:
        - service
        - version
        - apiVersion
        - capabilities
        - schemaVersion
        - serviceCore
      properties:
        service:
          type: string
          const: console
        version:
          type: string
          description: This package's version.
        apiVersion:
          type: string
          const: v1
        capabilities:
          type: array
          items:
            type: string
          description: "Static, hardcoded for console: `[\"totp\", \"admin-roles\", \"audit-trail\",
            \"service-proxy\"]`. Not instance-accurate — `totp` is listed even when `SECRETS_KEY` is unset (in
            which case enrolment fails with `503 TOTP_UNAVAILABLE`), and `service-proxy` says nothing about
            which services this instance actually has configured. Use `GET /api/services` for the real
            per-instance picture."
        schemaVersion:
          type: integer
          description: The open SQLite schema version (`PRAGMA user_version`).
        serviceCore:
          type: string
          description: >-
            Version of the `@atc-web/service-core` copy actually running. Console imports
            `registerInfo` from `@atc-web/service-core/fastify`, so unlike `gateway` (the one
            service in this platform with no `service-core` dependency, where this field is
            always `null`) this field is always a real semver string here, never `null`.
    Admin:
      type: object
      description: Administrator as `AdminService.view` projects it — never includes the password hash or the TOTP secret.
      required:
        - id
        - email
        - name
        - role
        - status
        - totpEnabled
        - lockedUntil
        - createdAt
        - updatedAt
        - lastLoginAt
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type:
            - string
            - "null"
        role:
          type: string
          enum:
            - admin
            - viewer
        status:
          type: string
          enum:
            - active
            - disabled
        totpEnabled:
          type: boolean
        lockedUntil:
          type:
            - string
            - "null"
          format: date-time
          description: Non-null only while a lockout is still in the future.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        lastLoginAt:
          type:
            - string
            - "null"
          format: date-time
    AdminSession:
      type: object
      required:
        - id
        - current
        - createdAt
        - lastSeenAt
        - ip
        - userAgent
      properties:
        id:
          type: string
        current:
          type: boolean
          description: True for the session making this request.
        createdAt:
          type: integer
          description: Epoch milliseconds (not an ISO string, unlike the timestamps on `Admin`).
        lastSeenAt:
          type: integer
          description: Epoch milliseconds.
        ip:
          type:
            - string
            - "null"
        userAgent:
          type:
            - string
            - "null"
    AuditEntry:
      type: object
      description: One entry of console's own local admin-activity log (distinct from the audit service).
      required:
        - id
        - adminId
        - adminEmail
        - action
        - target
        - meta
        - ip
        - at
      properties:
        id:
          type: integer
        adminId:
          type:
            - string
            - "null"
          format: uuid
        adminEmail:
          type:
            - string
            - "null"
        action:
          type: string
          description: e.g. `login.succeeded`, `login.failed`, `password.changed`, `totp.enabled`, `admin.created`,
            `flags.flag.update`.
        target:
          type:
            - string
            - "null"
        meta:
          type:
            - object
            - "null"
          additionalProperties: true
        ip:
          type:
            - string
            - "null"
        at:
          type: string
          format: date-time
    DocumentationService:
      type: object
      description: Public identity used by the API documentation selector; contains no URL or credential.
      required: [id, type, label]
      properties:
        id: { type: string }
        type:
          type: string
          enum: [audit, auth, console, flags, gateway, geo, media, notify, ratelimit, scheduler, search, shortlink, webhook-out]
        label: { type: string }
    ServiceDescriptor:
      type: object
      description: A configured service instance as `ServiceRegistry#describe` projects it. API keys and metrics
        tokens are never included.
      required:
        - id
        - type
        - label
        - url
        - publicUrl
        - hasMetrics
        - polling
      properties:
        id:
          type: string
          description: The `sid` used on every proxy route.
        type:
          type: string
          enum:
            - notify
            - auth
            - media
            - gateway
            - audit
            - shortlink
            - flags
            - scheduler
            - webhook-out
            - search
            - ratelimit
            - geo
          description: Decides which proxy routes are valid for this `sid`; a type mismatch is a `404 UNKNOWN_SERVICE`.
        label:
          type: string
        url:
          type: string
          description: Base URL console calls (server-side only).
        publicUrl:
          type:
            - string
            - "null"
        hasMetrics:
          type: boolean
          description: False only for a gateway instance with no metrics token configured.
        polling:
          type: object
          required:
            - enabled
            - intervalSec
          properties:
            enabled:
              type: boolean
            intervalSec:
              type: integer
              minimum: 5
              maximum: 3600
    ServiceStatus:
      type: object
      description: Liveness/readiness probe result console collects itself by calling the service's own `/health`
        and `/ready` (3 s timeout, unauthenticated). A probe that throws is reported as `false`, never as an
        error response.
      required:
        - health
        - ready
        - readyDetail
        - latencyMs
      properties:
        health:
          type: boolean
        ready:
          type: boolean
        readyDetail:
          description: The parsed `/ready` body, or the first 200 characters of it when it is not JSON, or `null` when
            the probe failed outright.
        latencyMs:
          type: integer
    ServiceSummary:
      description: "Headline numbers the typed client derives from the service's own Prometheus `/metrics`. Shape is
        per service type. `null` when the service exposes no metrics to console; `{ \"error\": \"...\" }` when
        collecting them failed — a failure here never fails the request."
      oneOf:
        - type: object
          additionalProperties: true
        - type: "null"
    ServiceOverview:
      type: object
      description: One service's registry entry plus its live probe result and metrics summary.
      required:
        - id
        - type
        - label
        - url
        - health
        - ready
        - readyDetail
        - latencyMs
        - summary
      properties:
        id:
          type: string
        type:
          type: string
        label:
          type: string
        url:
          type: string
        health:
          type: boolean
        ready:
          type: boolean
        readyDetail: {}
        latencyMs:
          type: integer
        summary:
          $ref: "#/components/schemas/ServiceSummary"
    ServiceAbout:
      type: object
      description: "One service's `GET /v1/info`, collected tolerantly: an unreachable service, one too old to serve
        the route (404), or a malformed body becomes `{ ok: false, error }` for that entry instead of failing
        the request."
      required:
        - id
        - type
        - label
        - url
        - ok
      properties:
        id:
          type: string
        type:
          type: string
        label:
          type: string
        url:
          type: string
        ok:
          type: boolean
        data:
          type: object
          additionalProperties: true
          description: "Present when `ok` is true: that service's own `/v1/info` body."
        error:
          type: string
          description: Present when `ok` is false.
    AuthUserDetail:
      type: object
      additionalProperties: true
      description: >-
        auth user detail, composed by console from three parallel downstream calls: `GET /v1/users/{id}`, `GET
        /v1/users/{id}/sessions` and `GET /v1/users/{id}/events?limit=50`.


        Every other top-level field is auth's `GET /v1/users/{id}` body spread in unchanged (see that
        service's own OpenAPI document); the fields listed here are the ones console adds and therefore owns.
      properties:
        sessions:
          type: array
          items:
            type: object
            additionalProperties: true
          description: The `items` array of auth's sessions response (the envelope itself is dropped).
        events:
          type: array
          items:
            type: object
            additionalProperties: true
          description: The `items` array of auth's events response, first page of 50.
        eventsNextBefore:
          type:
            - string
            - "null"
          description: The events response's `nextBefore` cursor, for `GET .../auth/users/{id}/events`.
    FlagDetail:
      type: object
      additionalProperties: true
      description: >-
        Feature-flag detail, composed by console from `GET /v1/flags/{key}` and `GET
        /v1/flags/{key}/history?limit=20` in parallel.


        Every other top-level field is flags' `GET /v1/flags/{key}` body spread in unchanged (see that
        service's own OpenAPI document); the fields listed here are the ones console adds and therefore owns.
      properties:
        history:
          type: array
          items:
            type: object
            additionalProperties: true
          description: The `items` array of the flag's change history, first page of 20.
        historyNextBefore:
          type:
            - string
            - "null"
          description: The history response's `nextBefore` cursor, for `GET .../flags/flags/{id}/history`.
    JobDetail:
      type: object
      additionalProperties: true
      description: >-
        Scheduled-job detail, composed by console from `GET /v1/jobs/{name}` and `GET
        /v1/runs?job={name}&limit=20` in parallel.


        Every other top-level field is scheduler's `GET /v1/jobs/{name}` body spread in unchanged (see that
        service's own OpenAPI document); the fields listed here are the ones console adds and therefore owns.
      properties:
        runs:
          type: array
          items:
            type: object
            additionalProperties: true
          description: The `items` array of the job's runs, first page of 20.
        runsNextBefore:
          type:
            - string
            - "null"
          description: The runs response's `nextBefore` cursor, for `GET .../scheduler/jobs/{id}/runs`.
    SubscriptionDetail:
      type: object
      additionalProperties: true
      description: >-
        Webhook subscription detail, composed by console from `GET /v1/subscriptions/{id}` and `GET
        /v1/deliveries?subscription={id}&limit=20` in parallel.


        Every other top-level field is webhook-out's `GET /v1/subscriptions/{id}` body spread in unchanged
        (see that service's own OpenAPI document); the fields listed here are the ones console adds and
        therefore owns.
      properties:
        deliveries:
          type: array
          items:
            type: object
            additionalProperties: true
          description: The `items` array of the subscription's deliveries, first page of 20.
        deliveriesNextBefore:
          type:
            - string
            - "null"
          description: The deliveries response's `nextBefore` cursor, for `GET
            .../webhook-out/deliveries?subscription=...`.
    LinkDetail:
      type: object
      additionalProperties: true
      description: >-
        Short-link detail, composed by console from `GET /v1/links/{code}` and `GET /v1/links/{code}/stats` in
        parallel.


        Every other top-level field is shortlink's `GET /v1/links/{code}` body spread in unchanged (see that
        service's own OpenAPI document); the fields listed here are the ones console adds and therefore owns.
      properties:
        stats:
          type: object
          additionalProperties: true
          description: shortlink's whole `GET /v1/links/{code}/stats` body, nested unchanged under this key (honoring
            `days` from the query string when given).

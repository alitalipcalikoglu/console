openapi: 3.1.0
info:
  title: console
  version: 1.1.0
  description: |-
    Independent admin console for the atc-web platform: its own accounts, sessions, TOTP and
    activity log, plus a hand-written, typed pass-through layer over every other service in the
    deployment. It is an operator surface, not a public API — there is no anonymous access to
    anything beyond the three operational probes.

    Two things shape the whole document. First, authentication is a **cookie session**
    (`console_session`) plus an `x-console-request: 1` CSRF header on mutations, not the
    `Authorization: Bearer` API key the twelve backend services use — and downstream calls are made
    with console's own per-service API key, never the administrator's identity. Second, console
    declares **no Fastify `response:` schema anywhere**: request shapes are real, enforced Ajv
    schemas and are documented here exactly, while the body of a pass-through route is the target
    service's raw JSON. Those responses are therefore typed as an open object and point at the
    target service's own document rather than carrying a hand-copied schema that nothing would
    keep honest. The handful of routes whose body console genuinely composes itself are typed in
    full.
  license:
    name: MIT
servers:
  - url: /
    description: "Base path of a running console instance (`PORT`, default 3004). Everything in this document is
      relative to that origin, which also serves the built Svelte app: any non-API `GET` that matches no
      static file falls back to `index.html`, and that SPA surface is deliberately not described here."
security:
  - SessionCookie: []
tags:
  - name: operational
    description: Health, readiness and service info. The only unauthenticated routes.
  - name: session
    description: Sign-in, second factor, sign-out and session state.
  - name: account
    description: The signed-in administrator's own sessions, password and TOTP enrolment.
  - name: admins
    description: Managing console accounts.
  - name: activity
    description: console's own local admin-activity log.
  - name: services
    description: The configured service registry, live probes and console-side settings.
  - name: documentation
    description: Authenticated, allowlisted aggregation of canonical service OpenAPI documents.
  - name: notify
    description: Pass-through to a notify instance.
  - name: auth
    description: Pass-through to an auth instance.
  - name: media
    description: Pass-through to a media instance, including the byte relay and the streaming upload.
  - name: audit
    description: Pass-through to an audit instance. Distinct from the `activity` tag, which is console's own log.
  - name: shortlink
    description: Pass-through to a shortlink instance.
  - name: flags
    description: Pass-through to a flags instance.
  - name: scheduler
    description: Pass-through to a scheduler instance.
  - name: webhook-out
    description: Pass-through to a webhook-out instance.
  - name: search
    description: Pass-through to a search instance.
  - name: ratelimit
    description: Pass-through to a ratelimit instance.
  - name: geo
    description: Pass-through to a geo instance.
paths:
  /openapi.yaml:
    get:
      operationId: console.openapi
      summary: Download the canonical OpenAPI document
      description: Returns this service's repository-root OpenAPI 3.1 document byte-for-byte.
      security: []
      responses:
        "200":
          description: Canonical OpenAPI document.
          content:
            text/yaml:
              schema: { type: string }

  /health:
    get:
      operationId: console.health.get
      tags:
        - operational
      summary: Liveness probe.
      description: Always `200` once the process is up. No dependency check and no authentication. Hand-rolled here
        rather than using `service-core`'s `registerProbes`.
      security: []
      x-stack-visibility: public
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /ready:
    get:
      operationId: console.ready.get
      tags:
        - operational
      summary: Readiness probe.
      description: Runs `db.ping()` on every call — uncached, unlike the backend services' shared probe helper,
        because the check is a single cheap SQLite read.
      security: []
      x-stack-visibility: public
      responses:
        "200":
          description: The database is reachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: The database could not be pinged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyUnavailable"
  /v1/info:
    get:
      operationId: console.info.get
      tags:
        - operational
      summary: Service identity and capabilities.
      description: The one operational route console takes from the shared `registerInfo` helper, so its shape is
        identical across all 13 services.
      security: []
      x-stack-visibility: public
      responses:
        "200":
          description: Service info.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Info"
  /api/session/login:
    post:
      operationId: console.session.login
      tags:
        - session
      summary: "First step of sign-in: email and password."
      description: "Pre-session: no cookie and no CSRF header are required. Always issues a session cookie on
        success. When the account has TOTP enabled the response is `{ totpRequired: true, admin: null }` and
        the new session is *pending* — it resolves on later requests but `requireSession` rejects it with `401
        TOTP_REQUIRED` until `POST /api/session/totp` completes it. Rate-limited per client IP before any
        password work happens. Failures are deliberately indistinguishable between \"no such email\" and
        \"wrong password\" (both `401 INVALID_CREDENTIALS`, both pay the same hashing cost)."
      security: []
      x-stack-visibility: operator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                password:
                  type: string
                  minLength: 1
                  maxLength: 1024
                  description: Length is only shape-checked here (1-1024). Strength rules (at least 12 characters, no single
                    repeated character, must not contain the local part of the account's email) are enforced
                    in the domain layer and fail with `400 WEAK_PASSWORD` carrying `details.problems`.
      responses:
        "200":
          description: Signed in, or signed in pending the second factor. The session cookie is set either way.
          content:
            application/json:
              schema:
                type: object
                required:
                  - totpRequired
                  - admin
                properties:
                  totpRequired:
                    type: boolean
                  admin:
                    oneOf:
                      - $ref: "#/components/schemas/Admin"
                      - type: "null"
                    description: Null while a second factor is still pending.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: "`console_session=<token>; Max-Age=<CONSOLE_SESSION_TTL_MIN*60>; Path=/; HttpOnly;
                SameSite=Strict[; Secure]`."
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          description: "`INVALID_CREDENTIALS` — unknown email or wrong password."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: "`ACCOUNT_DISABLED` — credentials were correct but the account is disabled."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "423":
          description: "`ACCOUNT_LOCKED` — too many recent failures; `details.retryAfterSec` says how long is left."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/session/totp:
    post:
      operationId: console.session.totp
      tags:
        - session
      summary: "Second step of sign-in: TOTP code."
      description: "Pre-session in the same sense as login: no CSRF header is required and `requireSession` is never
        called — but the pending session cookie from `POST /api/session/login` must already be present,
        otherwise the answer is `401 UNAUTHENTICATED`. Rate-limited per client IP. A wrong code counts towards
        the same lockout counter as a wrong password, so enough bad codes lock the account (`423`) and destroy
        the pending session."
      security: []
      x-stack-visibility: operator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - code
              properties:
                code:
                  type: string
                  pattern: ^[0-9]{6}$
                  description: "Six-digit TOTP code. A code is single-use: the verified time step is claimed atomically, so
                    replaying the same code within its window fails."
      responses:
        "200":
          description: Second factor accepted; the session is now fully usable.
          content:
            application/json:
              schema:
                type: object
                required:
                  - admin
                properties:
                  admin:
                    $ref: "#/components/schemas/Admin"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          description: "`UNAUTHENTICATED` (no pending session) or `INVALID_TOTP` (wrong code, or no second factor
            pending)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "423":
          description: "`ACCOUNT_LOCKED` — the failure threshold was reached; the pending session was deleted."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/session:
    get:
      operationId: console.session.get
      tags:
        - session
      summary: Current session state.
      description: "Never rejects: with no cookie, an expired one, or an unknown token it answers `200 { admin:
        null, totpPending: false }`; with a pending session `{ admin: null, totpPending: true }`. The app uses
        it to decide between the login form, the TOTP form and the console itself."
      security:
        - SessionCookie: []
        - {}
      x-stack-visibility: operator
      responses:
        "200":
          description: Session state.
          content:
            application/json:
              schema:
                type: object
                required:
                  - admin
                  - totpPending
                properties:
                  admin:
                    oneOf:
                      - $ref: "#/components/schemas/Admin"
                      - type: "null"
                  totpPending:
                    type: boolean
  /api/session/logout:
    post:
      operationId: console.session.logout
      tags:
        - session
      summary: Sign out.
      description: "The one mutating route with no CSRF header requirement: it does not call `requireSession`, it
        checks `request.admin`/`request.consoleSession` by hand, so the `x-console-request` gate never runs.
        Documented here as it really behaves — Phase 0 flagged the exemption as a design question for the
        team, and this document does not paper over it. It also never rejects: with no session it just clears
        the cookie and answers `204`. The blast radius is limited to a forced sign-out (the `SameSite=Strict`
        cookie still means a cross-site form post carries no session, so a third-party page cannot even reach
        an authenticated version of this route)."
      security:
        - SessionCookie: []
        - {}
      x-stack-visibility: operator
      responses:
        "204":
          description: Session revoked if there was one; the cookie is cleared either way.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: "`console_session=; Max-Age=0; Path=/; HttpOnly; SameSite=Strict[; Secure]`."
  /api/me/sessions:
    get:
      operationId: console.me.sessions.list
      tags:
        - account
      summary: List my active sessions.
      description: Requires any signed-in session (`requireSession`); both `admin` and `viewer` may call it.
      x-required-role: session
      x-stack-visibility: operator
      responses:
        "200":
          description: Sessions belonging to the signed-in administrator, with the current one flagged.
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminSession"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /api/me/sessions/logout-others:
    post:
      operationId: console.me.sessions.logoutOthers
      tags:
        - account
      summary: Revoke my other sessions.
      description: Requires any signed-in session (`requireSession`); both `admin` and `viewer` may call it.
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      x-required-role: session
      x-stack-visibility: operator
      responses:
        "200":
          description: Every session except the current one was revoked.
          content:
            application/json:
              schema:
                type: object
                required:
                  - revoked
                properties:
                  revoked:
                    type: integer
                    description: How many sessions were removed.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/me/password:
    post:
      operationId: console.me.password.change
      tags:
        - account
      summary: Change my password.
      description: >-
        Verifies the current password first, enforces the strength rules on the new one, then revokes every
        other session for this administrator.


        Requires any signed-in session (`requireSession`); both `admin` and `viewer` may call it.
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      x-required-role: session
      x-stack-visibility: operator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - currentPassword
                - newPassword
              properties:
                currentPassword:
                  type: string
                  minLength: 1
                  maxLength: 1024
                  description: Length is only shape-checked here (1-1024). Strength rules (at least 12 characters, no single
                    repeated character, must not contain the local part of the account's email) are enforced
                    in the domain layer and fail with `400 WEAK_PASSWORD` carrying `details.problems`.
                newPassword:
                  type: string
                  minLength: 1
                  maxLength: 1024
                  description: Length is only shape-checked here (1-1024). Strength rules (at least 12 characters, no single
                    repeated character, must not contain the local part of the account's email) are enforced
                    in the domain layer and fail with `400 WEAK_PASSWORD` carrying `details.problems`.
      responses:
        "204":
          description: Password changed; all other sessions revoked.
        "400":
          description: "`VALIDATION_FAILED`, or `WEAK_PASSWORD` with `details.problems` listing every rule the new
            password broke."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: "`UNAUTHENTICATED`, or `INVALID_CREDENTIALS` when the current password is wrong."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/me/totp/start:
    post:
      operationId: console.me.totp.start
      tags:
        - account
      summary: Begin TOTP enrolment.
      description: >-
        Generates and stores a new secret that is not enforced until `POST /api/me/totp/confirm` succeeds. The
        secret is returned exactly once, in this response.


        Requires any signed-in session (`requireSession`); both `admin` and `viewer` may call it.
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      x-required-role: session
      x-stack-visibility: operator
      responses:
        "200":
          description: Enrolment started.
          content:
            application/json:
              schema:
                type: object
                required:
                  - secret
                  - uri
                properties:
                  secret:
                    type: string
                    description: Base32 TOTP secret.
                  uri:
                    type: string
                    description: "`otpauth://totp/...` URI for an authenticator app, using `TOTP_ISSUER`."
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: "`CONFLICT` — two-factor authentication is already enabled."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: "`TOTP_UNAVAILABLE` — `SECRETS_KEY` is not configured, so a secret cannot be sealed at rest and
            enrolment is refused."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/me/totp/confirm:
    post:
      operationId: console.me.totp.confirm
      tags:
        - account
      summary: Confirm TOTP enrolment.
      description: Requires any signed-in session (`requireSession`); both `admin` and `viewer` may call it.
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      x-required-role: session
      x-stack-visibility: operator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - code
              properties:
                code:
                  type: string
                  pattern: ^[0-9]{6}$
                  description: "Six-digit TOTP code. A code is single-use: the verified time step is claimed atomically, so
                    replaying the same code within its window fails."
      responses:
        "204":
          description: Two-factor authentication is now enabled for this account.
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          description: "`UNAUTHENTICATED`, or `INVALID_TOTP` when the code does not match or its time step was already
            used."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: "`CONFLICT` — no enrolment is in progress (never started, or already finished)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/me/totp/disable:
    post:
      operationId: console.me.totp.disable
      tags:
        - account
      summary: Disable TOTP.
      description: |-
        Requires both the current password and a valid code.

        Requires any signed-in session (`requireSession`); both `admin` and `viewer` may call it.
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      x-required-role: session
      x-stack-visibility: operator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - password
                - code
              properties:
                password:
                  type: string
                  minLength: 1
                  maxLength: 1024
                  description: Length is only shape-checked here (1-1024). Strength rules (at least 12 characters, no single
                    repeated character, must not contain the local part of the account's email) are enforced
                    in the domain layer and fail with `400 WEAK_PASSWORD` carrying `details.problems`.
                code:
                  type: string
                  pattern: ^[0-9]{6}$
                  description: "Six-digit TOTP code. A code is single-use: the verified time step is claimed atomically, so
                    replaying the same code within its window fails."
      responses:
        "204":
          description: Two-factor authentication disabled.
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          description: "`UNAUTHENTICATED`, `INVALID_CREDENTIALS` (wrong password) or `INVALID_TOTP` (wrong code)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: "`CONFLICT` — two-factor authentication is not enabled."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: "`TOTP_SECRET_CORRUPT` — the stored secret could not be unsealed with the configured keys."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/admins:
    get:
      operationId: console.admins.list
      tags:
        - admins
      summary: List console administrators.
      description: |-
        Readable by any signed-in session, including a `viewer`.

        Requires any signed-in session (`requireSession`); both `admin` and `viewer` may call it.
      x-required-role: session
      x-stack-visibility: operator
      responses:
        "200":
          description: All console accounts.
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Admin"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      operationId: console.admins.create
      tags:
        - admins
      summary: Create a console administrator.
      description: "**Requires the `admin` role** (`requireAdmin`): a signed-in `viewer` gets `403 FORBIDDEN`."
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      x-required-role: admin
      x-stack-visibility: operator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - email
                - password
                - role
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                password:
                  type: string
                  minLength: 1
                  maxLength: 1024
                  description: Length is only shape-checked here (1-1024). Strength rules (at least 12 characters, no single
                    repeated character, must not contain the local part of the account's email) are enforced
                    in the domain layer and fail with `400 WEAK_PASSWORD` carrying `details.problems`.
                name:
                  type: string
                  maxLength: 80
                role:
                  type: string
                  enum:
                    - admin
                    - viewer
      responses:
        "201":
          description: Account created.
          content:
            application/json:
              schema:
                type: object
                required:
                  - admin
                properties:
                  admin:
                    $ref: "#/components/schemas/Admin"
        "400":
          description: "`VALIDATION_FAILED`, `INVALID_ARGUMENT` (email rejected by the domain-level check) or
            `WEAK_PASSWORD`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: "`EMAIL_TAKEN` — an account with this email already exists."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/admins/{id}:
    patch:
      operationId: console.admins.update
      tags:
        - admins
      summary: Update an administrator's name, role or status.
      description: >-
        Two guards beyond validation: the last active administrator can be neither demoted nor disabled, and
        nobody can demote or disable their own account.


        **Requires the `admin` role** (`requireAdmin`): a signed-in `viewer` gets `403 FORBIDDEN`.
      parameters:
        - $ref: "#/components/parameters/AdminIdParam"
        - $ref: "#/components/parameters/CsrfHeader"
      x-required-role: admin
      x-stack-visibility: operator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 80
                role:
                  type: string
                  enum:
                    - admin
                    - viewer
                status:
                  type: string
                  enum:
                    - active
                    - disabled
      responses:
        "200":
          description: Updated account.
          content:
            application/json:
              schema:
                type: object
                required:
                  - admin
                properties:
                  admin:
                    $ref: "#/components/schemas/Admin"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "`NOT_FOUND` — no such administrator."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: "`LAST_ADMIN` (at least one active administrator must remain) or `CONFLICT` (you cannot demote or
            disable your own account)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    delete:
      operationId: console.admins.delete
      tags:
        - admins
      summary: Delete an administrator.
      description: |-
        Irreversible. Refused for your own account, and for the last active administrator.

        **Requires the `admin` role** (`requireAdmin`): a signed-in `viewer` gets `403 FORBIDDEN`.
      parameters:
        - $ref: "#/components/parameters/AdminIdParam"
        - $ref: "#/components/parameters/CsrfHeader"
      x-required-role: admin
      x-stack-visibility: operator
      responses:
        "204":
          description: Account deleted and its sessions revoked.
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "`NOT_FOUND` — no such administrator."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: "`CONFLICT` (you cannot delete your own account) or `LAST_ADMIN` (at least one active
            administrator must remain)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/admins/{id}/password:
    post:
      operationId: console.admins.resetPassword
      tags:
        - admins
      summary: Set another administrator's password.
      description: "**Requires the `admin` role** (`requireAdmin`): a signed-in `viewer` gets `403 FORBIDDEN`."
      parameters:
